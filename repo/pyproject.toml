[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerway-arc"
version = "0.2.0"
description = "Reproducible, quality-gated Arc research model pipelines"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy==2.4.6", "scipy==1.18.0", "scikit-learn==1.9.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
plot = ["matplotlib==3.10.9"]
bench = ["bleak==3.1.0"]

[project.scripts]
arc = "arc.cli:main"

[tool.setuptools.packages.find]
include = ["arc*"]

[tool.setuptools.package-data]
arc = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
